<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo principal navbar - KONSCIO en NARANJA con brazo impresora -->
  
  <!-- Brazo de impresora 3D -->
  <g id="printer-arm">
    <!-- Riel superior -->
    <rect x="0" y="8" width="38" height="3" rx="1.5" fill="#7F8C8D" opacity="0.8"/>
    
    <!-- Brazo vertical del extrusor -->
    <rect x="16" y="8" width="4" height="12" rx="1" fill="#95A5A6"/>
    
    <!-- Cabezal del extrusor -->
    <rect x="13" y="18" width="10" height="8" rx="2" fill="#5D6D7E"/>
    <circle cx="18" cy="22" r="1.5" fill="#E67E22"/>
    
    <!-- Material siendo extruido -->
    <rect x="16.5" y="26" width="3" height="4" fill="#E67E22" opacity="0.7"/>
    <circle cx="18" cy="30" r="1.5" fill="#E67E22" opacity="0.5"/>
  </g>
  
  <!-- Casa 3D en construcción -->
  <g id="logo-house">
    <!-- Capa trasera (más clara) -->
    <path d="M8 32L20 22L32 32V44C32 45.1 31.1 46 30 46H10C8.9 46 8 45.1 8 44V32Z" fill="#A8E6CF" opacity="0.6"/>
    
    <!-- Capa media -->
    <path d="M5 29L20 17L35 29V43C35 44.1 34.1 45 33 45H7C5.9 45 5 44.1 5 43V29Z" fill="#2ECC71"/>
    
    <!-- Capa frontal (más oscura) -->
    <path d="M2 26L20 12L38 26V42C38 43.1 37.1 44 36 44H4C2.9 44 2 43.1 2 42V26Z" fill="#27AE60"/>
    
    <!-- Detalle puerta -->
    <rect x="16" y="34" width="8" height="10" rx="1" fill="white" opacity="0.9"/>
    
    <!-- Detalle ventana -->
    <circle cx="28" cy="32" r="2.5" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Texto KONSCIO en NARANJA -->
  <text x="46" y="32" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#E67E22">KONSCIO</tspan><tspan fill="#2ECC71">3D</tspan>
  </text>
  
  <!-- Texto HOUSING -->
  <text x="46" y="46" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7F8C8D" letter-spacing="1.5">
    HOUSING
  </text>
  
  <!-- Línea decorativa debajo de 3D -->
  <line x1="126" y1="34" x2="155" y2="34" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"/>
</svg>
